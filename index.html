<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="description" content="Prêt pour la France — Préparez-vous à l'examen civique du Contrat d'Intégration Républicaine">
  <title>Prêt pour la France</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="header" role="banner">
    <div class="header__logo">
      <span class="header__logo-flag">🇫🇷</span>
      <span>Prêt pour la France</span>
    </div>
    <div class="header__right">
      <div class="lang-switcher" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <!-- ── Overlay ── -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ── Layout ── -->
  <div class="layout">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
      <ul class="sidebar__nav" id="sidebar-nav"></ul>
    </nav>

    <!-- Main -->
    <main class="main" id="main" role="main">

      <!-- Home -->
      <section class="view" id="view-home"></section>

      <!-- Study -->
      <section class="view" id="view-study"></section>

      <!-- Exam / Results -->
      <section class="view" id="view-exam"></section>

      <!-- T&C -->
      <section class="view" id="view-tc"></section>

    </main>
  </div>

  <!-- ── Footer ── -->
  <footer class="footer" id="footer" role="contentinfo"></footer>

  <!-- ── Mobile nav ── -->
  <nav class="mobile-nav" aria-label="Navigation mobile">
    <div class="mobile-nav__items" id="mobile-nav-items"></div>
  </nav>

  <!-- ── Scripts ── -->
  <script src="./js/translations.js"></script>
  <script src="./js/materials.js"></script>
  <script src="./js/questions.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
